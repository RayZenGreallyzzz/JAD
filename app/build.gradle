plugins { id 'com.android.application' }
android {
    namespace 'com.phoenix.starshipbuilder'
    compileSdk 35
    defaultConfig {
        applicationId 'com.phoenix.starshipbuilder'
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
tasks.register('copyWebAssets', Copy) {
    from('../web')
    include '*.html', '*.css', '*.js'
    into('src/main/assets')
}
preBuild.dependsOn tasks.named('copyWebAssets')
